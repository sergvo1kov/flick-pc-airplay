name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
    # docs-only changes don't need a 10-minute Windows build
    paths-ignore: ['**.md', 'docs/**', 'tests/ui/**', '.github/workflows/release-notes.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to attach the installer to a GitHub Release on tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit tests (mDNS, DACP remote, parsers, session, settings)
        run: node --test tests/*.test.js

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up MSYS2 (UCRT64) with GStreamer
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-libsoup3
            mingw-w64-ucrt-x86_64-glib-networking

      - name: Build UxPlay (AirPlay core)
        shell: msys2 {0}
        run: bash scripts/build-uxplay.sh .uxplay-build

      - name: Bundle engine (uxplay.exe + GStreamer runtime)
        shell: msys2 {0}
        run: bash scripts/bundle-engine.sh .uxplay-build/UxPlay/build/uxplay.exe engine

      - name: Verify bundled engine in isolation
        shell: msys2 {0}
        run: bash scripts/verify-engine.sh engine

      - name: Take version from tag (v1.2.3 -> 1.2.3)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Release when a tag is pushed, or when main carries a package.json
      # version that has no release yet (bump version + push = new update).
      - name: Decide whether this build is a release
        id: rel
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release=true
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then
            if ! git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null 2>&1; then release=true; fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version $v, release: $release"

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no code-signing certificate
        run: npm run dist

      - name: Check OTA update feed (latest.yml vs installer)
        shell: bash
        run: node scripts/check-update-feed.js local dist "$(node -p "require('./package.json').version")"

      - uses: actions/upload-artifact@v4
        with:
          name: FlickAirPlay-Setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Release notes from CHANGELOG.md
        if: steps.rel.outputs.release == 'true'
        shell: bash
        run: node scripts/release-notes.js "${{ steps.rel.outputs.version }}" "${{ github.repository }}" > release-notes.md

      - name: Publish release
        if: steps.rel.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          tag_name: v${{ steps.rel.outputs.version }}
          name: Flick AirPlay ${{ steps.rel.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          generate_release_notes: false
          make_latest: true

      - name: Verify published OTA feed (what installed apps will see)
        if: steps.rel.outputs.release == 'true'
        shell: bash
        run: node scripts/check-update-feed.js remote "${{ github.repository }}" "${{ steps.rel.outputs.version }}"
