name: Sync release notes

# Rewrites the description of every published release from CHANGELOG.md,
# so editing the changelog also fixes the text on the Releases page.
on:
  push:
    branches: [main]
    paths: ['CHANGELOG.md', 'scripts/release-notes.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Update release descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            v="${tag#v}"
            node scripts/release-notes.js "$v" "${{ github.repository }}" > notes.md
            gh release edit "$tag" --title "Flick AirPlay $v" --notes-file notes.md
            echo "updated $tag"
          done
